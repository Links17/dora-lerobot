robot_id: so_arm
max_control_hz: 30
has_gripper: true
camera_names: [wrist, overhead]
joints:
  - name: shoulder_pan
    minimum_rad: -2.8
    maximum_rad: 2.8
    max_velocity_rad_s: 2.0
  - name: shoulder_lift
    minimum_rad: -1.8
    maximum_rad: 1.8
    max_velocity_rad_s: 2.0
  - name: elbow_flex
    minimum_rad: -2.2
    maximum_rad: 2.2
    max_velocity_rad_s: 2.0
  - name: wrist_flex
    minimum_rad: -2.8
    maximum_rad: 2.8
    max_velocity_rad_s: 2.5
  - name: wrist_roll
    minimum_rad: -3.14
    maximum_rad: 3.14
    max_velocity_rad_s: 3.0
  - name: gripper
    minimum_rad: 0.0
    maximum_rad: 1.0
    max_velocity_rad_s: 2.0
