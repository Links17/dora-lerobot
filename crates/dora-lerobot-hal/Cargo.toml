[package]
name = "dora-lerobot-hal"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
async-trait = "0.1"
bytes = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
robot-hal-core = { path = "../../../links/seeed-robotic/robot-hal/crates/robot-hal-core" }
robot-hal-can = { path = "../../../links/seeed-robotic/robot-hal/crates/robot-hal-can" }
robot-hal-runtime = { path = "../../../links/seeed-robotic/robot-hal/crates/robot-hal-runtime" }
robot-hal-serial = { path = "../../../links/seeed-robotic/robot-hal/crates/robot-hal-serial" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
robot-hal-testkit = { path = "../../../links/seeed-robotic/robot-hal/crates/robot-hal-testkit" }
