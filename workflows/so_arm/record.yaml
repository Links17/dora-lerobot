nodes:
  - id: so-arm
    path: cargo
    args: run --quiet -p so-arm-hal-node
    inputs:
      tick: dora/timer/millis/33
      action: teleoperator/action
    outputs: [observation, safe_action]
  - id: recorder
    path: uv
    args: run python -m dora_lerobot.nodes.recorder_node
    inputs:
      observation: so-arm/observation
      action: so-arm/safe_action
