nodes:
  - id: replay
    path: uv
    args: [run, python, -m, dora_lerobot.nodes.replay_node]
    inputs:
      tick: dora/timer/millis/33
    outputs: [action]
  - id: so-arm
    path: uv
    args: [run, python, -m, dora_lerobot.runtime.so_arm_node]
    inputs:
      action: replay/action
    outputs: [safe_action]
