nodes:
  - id: so-arm
    path: cargo
    args: run --quiet -p so-arm-hal-node
    inputs:
      tick: dora/timer/millis/33
      action: policy/action
    outputs: [observation, safe_action]
  - id: policy
    path: uv
    args: run python -m dora_lerobot.nodes.policy_node
    inputs:
      observation: so-arm/observation
    outputs: [action]
