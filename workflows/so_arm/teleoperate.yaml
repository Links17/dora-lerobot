nodes:
  - id: so-arm
    path: cargo
    args: run --quiet -p so-arm-hal-node
    inputs:
      tick: dora/timer/millis/33
      action: teleoperator/action
    outputs: [observation, safe_action, status]
  - id: teleoperator
    path: uv
    args: run python -m dora_lerobot.runtime.so_arm_teleop_node
    inputs:
      tick: dora/timer/millis/33
    outputs: [action]
