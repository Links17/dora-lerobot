nodes:
  - id: b601-dm
    path: cargo
    args: run --quiet -p b601-dm-hal-node
    inputs:
      tick: dora/timer/millis/20
      action: cloud-policy/action
    outputs: [observation, safe_action, status]
  - id: cloud-policy
    path: uv
    args: [run, python, -m, dora_lerobot.nodes.cloud_policy_node]
    inputs:
      observation: b601-dm/observation
    outputs: [action]
