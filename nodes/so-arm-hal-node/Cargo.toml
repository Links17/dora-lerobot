[package]
name = "so-arm-hal-node"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
dora-lerobot-hal = { path = "../../crates/dora-lerobot-hal" }
dora-node-api = { version = "1.0.0-rc.4", default-features = false }
eyre = "0.6"
robot-hal-adapter-serialport = { path = "../../../links/seeed-robotic/robot-hal/adapters/serialport" }
robot-hal-core = { path = "../../../links/seeed-robotic/robot-hal/crates/robot-hal-core" }
robot-hal-runtime = { path = "../../../links/seeed-robotic/robot-hal/crates/robot-hal-runtime" }
robot-hal-serial = { path = "../../../links/seeed-robotic/robot-hal/crates/robot-hal-serial" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
